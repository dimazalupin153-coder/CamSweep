name: Build iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build App
      run: |
        mkdir -p Payload/CamSweep.app
        xcrun --sdk iphoneos swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) -target arm64-apple-ios15.0 -o Payload/CamSweep.app/CamSweep CamSweep/*.swift
        cp CamSweep/Info.plist Payload/CamSweep.app/
        cp CamSweep/passwords.txt Payload/CamSweep.app/
        zip -r CamSweep.ipa Payload
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: CamSweep-ipa
        path: CamSweep.ipa
